name: Android verification and APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests, lint, APK
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Android 11 device test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            mkdir -p app/build/device-screenshots
            adb pull /sdcard/Download/mapexit-explore.png app/build/device-screenshots/explore.png
            adb pull /sdcard/Download/mapexit-battle.png app/build/device-screenshots/battle.png
            adb pull /sdcard/Download/mapexit-trap.png app/build/device-screenshots/trap.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/test/
            app/build/reports/lint-results-debug.*
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MapExit-debug
          path: app/build/outputs/apk/debug/app-debug.apk

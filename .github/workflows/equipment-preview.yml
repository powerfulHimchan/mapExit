name: Equipment fitting preview
on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/equipment-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Render body and shield review on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.powerfulhimchan.mapexit.AShieldReview051Test,com.powerfulhimchan.mapexit.AnimationEquipment056Test --no-daemon
            mkdir -p app/build/equipment-preview
            adb pull /sdcard/Download/ app/build/equipment-preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equipment-fitting-preview
          path: |
            app/build/equipment-preview/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
